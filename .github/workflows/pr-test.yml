name: PR Test

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          shellcheck -x install-scripts/*.sh install-scripts/lib/*.sh config/desktop-common.sh config/sets/*/apply.sh config/sets/basic/tmux/scripts/*.sh scripts/* tests/*.sh

      # The gnome/kde/xfce sets apply the same decisions through three
      # unrelated backends, so nothing else would notice one falling behind.
      - name: Desktop intent coverage
        run: bash tests/check-desktop-intents.sh

      - name: Fish syntax check
        run: |
          sudo apt-get update && sudo apt-get install -y fish
          for f in config/sets/basic/fish/*.fish install-scripts/*.fish; do
            fish --no-execute "$f"
          done

  test:
    strategy:
      matrix:
        distro:
          - alpine
          - archlinux
          - fedora
          - ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Only build
        run: |
          docker buildx build --platform linux/amd64 --output "type=image,push=false" -f tests/Dockerfile-${{ matrix.distro }} .

  test-macos:
    # macOS has no equivalent to the Dockerfile-based distro tests above
    # (no official macOS container images), so this runs directly on a
    # hosted macOS runner instead.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Full install
        run: make basic

      # Verify the install actually landed, not just that `make basic` exited 0.
      - name: Verify install
        run: |
          test -L ~/.config/nvim/init.lua
          test -L ~/.config/fish/conf.d/aliases.fish
          fish -c 'functions -q gitissue'
          fish -c 'functions -q fisher'